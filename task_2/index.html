<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>
    <button id="program-button">Показать программу</button>
    <div id="program" hidden>
      <h2>Программа</h2>
      <p>Сбор: 18:30. Начало: 19:00.</p>
    </div>
    <p id="data-error" hidden></p>
  </div>

  <div class="form-card">
    <button id="form-button">Выбрать услуги</button>
    <form id="services-form" hidden>
      <h2>Услуги</h2>
      <label><input type="checkbox" id="guide"> Экскурсия с гидом — 500 руб.</label><br>
      <label><input type="checkbox" id="audio"> Аудиогид — 350 руб.</label><br>
      <label><input type="checkbox" id="catalog"> Каталог выставки — 250 руб.</label><br>
      <button type="submit">Рассчитать</button>
    </form>
    <p id="report-error" hidden></p>
    <p id="result" hidden></p>
    <pre id="report-json" hidden></pre>
  </div>

  <script src="app.js"></script>
</body>
</html>
